<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tienda</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<script type="module" src="https://bt-cdn.yappy.cloud/v1/cdn/web-component-btn-yappy.js"></script>
<style>
    body { font-family: 'Inter', sans-serif; }
    .font-display { font-family: 'Cormorant Garamond', serif; }
    @keyframes marquee { from { transform: translateX(0); } to { transform: translateX(-50%); } }
    .marquee-track { animation: marquee 22s linear infinite; }
    .scroll-sin-barra::-webkit-scrollbar { display: none; }
    .scroll-sin-barra { -ms-overflow-style: none; scrollbar-width: none; }
</style>
</head>
<body class="bg-[#FFFBF9] text-[#3E2C30]">

    <!-- Barra de anuncios -->
    <div id="barra-promo" class="bg-[#B76E79] text-white text-xs font-medium py-2 overflow-hidden whitespace-nowrap hidden">
        <div id="marquee-track" class="marquee-track inline-block"></div>
    </div>

    <!-- Header -->
    <header class="sticky top-0 z-40 bg-[#FFFBF9]/90 backdrop-blur border-b border-[#F1D9DE]">
        <div class="max-w-6xl mx-auto px-4 sm:px-5 py-3 grid grid-cols-3 items-center">
            <div class="flex justify-start">
                <button class="p-2 rounded-full hover:bg-[#F8E4E8] transition"><i data-lucide="search" class="h-5 w-5 text-[#7D4F58]"></i></button>
            </div>
            <div class="flex justify-center items-center gap-2">
                <img id="header-logo" src="" class="h-9 w-9 rounded-full object-cover hidden">
                <h1 id="header-nombre" class="font-display text-xl sm:text-2xl font-semibold tracking-wide text-[#7D4F58] truncate">Tienda</h1>
            </div>
            <div class="flex justify-end items-center gap-1">
                <button class="p-2 rounded-full hover:bg-[#F8E4E8] transition"><i data-lucide="user" class="h-5 w-5 text-[#7D4F58]"></i></button>
                <button id="btn-abrir-carrito" class="relative p-2 rounded-full hover:bg-[#F8E4E8] transition">
                    <i data-lucide="shopping-bag" class="h-5 w-5 text-[#7D4F58]"></i>
                    <span id="carrito-contador" class="absolute -top-1 -right-1 bg-[#B76E79] text-white text-[10px] font-bold rounded-full h-5 w-5 flex items-center justify-center hidden">0</span>
                </button>
            </div>
        </div>

        <!-- Nav de texto -->
        <nav class="max-w-6xl mx-auto px-4 sm:px-5 pb-2 flex justify-center gap-4 overflow-x-auto scroll-sin-barra text-sm font-medium">
            <div id="nav-categorias-texto" class="flex gap-4 whitespace-nowrap"></div>
        </nav>
    </header>

    <!-- Iconos circulares de categoria -->
    <div class="max-w-6xl mx-auto px-4 sm:px-5 py-4 overflow-x-auto scroll-sin-barra">
        <div id="lista-categorias-iconos" class="flex gap-4 sm:gap-6 justify-start sm:justify-center w-max mx-auto"></div>
    </div>

    <!-- Hero destacado -->
    <section id="seccion-hero" class="max-w-6xl mx-auto px-4 sm:px-5 py-6 hidden">
        <div class="grid sm:grid-cols-2 gap-6 items-center bg-[#FDF6F7] rounded-2xl overflow-hidden p-6 sm:p-10">
            <div>
                <h2 id="hero-titulo" class="font-display text-3xl sm:text-4xl font-semibold text-[#7D4F58] mb-3"></h2>
                <p id="hero-descripcion" class="text-[#9C6B76]"></p>
            </div>
            <div class="aspect-[4/3] rounded-xl overflow-hidden">
                <img id="hero-imagen" src="" class="w-full h-full object-cover">
            </div>
        </div>
    </section>

    <!-- Barra de orden -->
    <div class="max-w-6xl mx-auto px-4 sm:px-5 py-3 flex items-center justify-between text-sm">
        <span class="text-[#9C6B76]">Ordenar por:</span>
        <div class="flex items-center gap-3">
            <select id="select-orden" class="border border-[#EAC7CE] rounded-full px-3 py-1.5 text-[#7D4F58] bg-white focus:outline-none">
                <option value="recientes">Más recientes</option>
                <option value="precio_asc">Precio: menor a mayor</option>
                <option value="precio_desc">Precio: mayor a menor</option>
            </select>
            <span id="contador-productos" class="text-[#B8909A]">0 productos</span>
        </div>
    </div>

    <!-- Grid de productos -->
    <main class="max-w-6xl mx-auto px-4 sm:px-5 pb-24">
        <div id="grid-productos" class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-x-3 sm:gap-x-4 gap-y-8"></div>
        <p id="sin-productos" class="text-center text-[#B8909A] py-20 hidden">No se encontró ningún producto.</p>
    </main>

    <footer class="border-t border-[#F1D9DE] py-8 text-center text-sm text-[#B8909A]">
        <p id="footer-direccion"></p>
        <p id="footer-telefono"></p>
    </footer>

    <!-- Modal producto -->
    <div id="modal-producto" class="fixed inset-0 bg-black/40 hidden items-center justify-center p-4 z-50">
        <div class="bg-white rounded-2xl shadow-xl w-full max-w-3xl overflow-hidden grid sm:grid-cols-2 max-h-[90vh] overflow-y-auto">
            <div class="bg-[#FDF6F7] aspect-square flex items-center justify-center">
                <img id="modal-producto-imagen" src="" class="w-full h-full object-cover">
            </div>
            <div class="p-6 sm:p-8 flex flex-col">
                <button id="btn-cerrar-modal-producto" class="self-end text-[#B8909A] hover:text-[#7D4F58]"><i data-lucide="x" class="h-5 w-5"></i></button>
                <p id="modal-producto-categoria" class="text-xs uppercase tracking-widest text-[#B8909A] mb-1"></p>
                <h3 id="modal-producto-nombre" class="font-display text-2xl font-semibold text-[#7D4F58] mb-3"></h3>
                <p id="modal-producto-precio" class="text-xl font-semibold text-[#B76E79] mb-6"></p>
                <button id="btn-agregar-carrito" class="mt-auto w-full bg-[#B76E79] text-white font-semibold py-3 rounded-full hover:bg-[#a15c67] transition">Agregar al carrito</button>
            </div>
        </div>
    </div>

    <!-- Carrito lateral -->
    <div id="overlay-carrito" class="fixed inset-0 bg-black/40 hidden z-40"></div>
    <aside id="panel-carrito" class="fixed top-0 right-0 h-full w-full max-w-sm bg-white z-50 translate-x-full transition-transform duration-300 flex flex-col shadow-xl">
        <div class="p-5 border-b border-[#F1D9DE] flex justify-between items-center">
            <h3 class="font-display text-xl font-semibold text-[#7D4F58]">Tu carrito</h3>
            <button id="btn-cerrar-carrito" class="text-[#B8909A] hover:text-[#7D4F58]"><i data-lucide="x" class="h-5 w-5"></i></button>
        </div>
        <div id="items-carrito" class="flex-1 overflow-y-auto p-5 space-y-4"></div>
        <div class="p-5 border-t border-[#F1D9DE]">
            <div class="flex justify-between mb-4 font-semibold text-[#7D4F58]">
                <span>Total</span>
                <span id="carrito-total">$0.00</span>
            </div>
            <button id="btn-abrir-checkout-yappy" class="w-full bg-[#B76E79] text-white font-semibold py-3 rounded-full hover:bg-[#a15c67] transition flex items-center justify-center gap-2 mb-2">
                <i data-lucide="credit-card" class="h-5 w-5"></i> Pagar con Yappy
            </button>
            <button id="btn-checkout-whatsapp" class="w-full bg-[#25D366] text-white font-semibold py-3 rounded-full hover:bg-[#1ebc59] transition flex items-center justify-center gap-2">
                <i data-lucide="message-circle" class="h-5 w-5"></i> Pedir por WhatsApp
            </button>
        </div>
    </aside>

    <!-- Modal checkout Yappy -->
    <div id="modal-checkout" class="fixed inset-0 bg-black/40 hidden items-center justify-center p-4 z-[60]">
        <div class="bg-white rounded-2xl shadow-xl w-full max-w-sm p-6">
            <div class="flex justify-between items-center mb-4">
                <h3 class="font-display text-xl font-semibold text-[#7D4F58]">Pagar con Yappy</h3>
                <button id="btn-cerrar-checkout" class="text-[#B8909A] hover:text-[#7D4F58]"><i data-lucide="x" class="h-5 w-5"></i></button>
            </div>

            <div id="checkout-form" class="space-y-3">
                <div>
                    <label class="text-sm font-semibold text-[#9C6B76]">Nombre completo</label>
                    <input type="text" id="checkout-nombre" class="w-full mt-1 border border-[#EAC7CE] rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-[#B76E79]">
                </div>
                <div>
                    <label class="text-sm font-semibold text-[#9C6B76]">Teléfono (tu cuenta Yappy)</label>
                    <input type="tel" id="checkout-telefono" placeholder="Ej: 60001234" class="w-full mt-1 border border-[#EAC7CE] rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-[#B76E79]">
                </div>
                <div>
                    <label class="text-sm font-semibold text-[#9C6B76]">Dirección de entrega (opcional)</label>
                    <input type="text" id="checkout-direccion" class="w-full mt-1 border border-[#EAC7CE] rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-[#B76E79]">
                </div>
                <p id="checkout-error" class="text-sm text-red-600 hidden"></p>
                <button id="btn-continuar-checkout" class="w-full bg-[#B76E79] text-white font-semibold py-3 rounded-full hover:bg-[#a15c67] transition mt-2">Continuar</button>
            </div>

            <div id="checkout-yappy-wrapper" class="hidden flex-col items-center gap-3">
                <p class="text-sm text-[#9C6B76] text-center">Total a pagar: <span id="checkout-monto" class="font-semibold text-[#7D4F58]"></span></p>
                <btn-yappy rounded="true" theme="light" id="btn-yappy-component" style="width: 100%;"></btn-yappy>
                <p id="checkout-estado" class="text-sm text-center text-[#9C6B76]"></p>
            </div>
        </div>
    </div>

    <script src="/admin/config.js"></script>
    <script src="/js/tienda.js"></script>
</body>
</html>
